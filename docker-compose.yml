services:
  backend:
    build:
      context: ./backend
    container_name: network-monitor-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: network-monitor-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped
